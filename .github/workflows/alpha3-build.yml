name: SL8 Alpha 3 - Build and Package

on:
  push:
    branches:
      - sl8/alpha3-development
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Type check
        run: npm run lint
      - name: Build SL8 desktop
        run: npm run build
      - name: Package Debian application
        run: npm run package:deb
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Upload Debian installer
        uses: actions/upload-artifact@v4
        with:
          name: sl8-alpha3-debian-package
          path: |
            dist/*.deb
            release/*.deb
          if-no-files-found: error
          retention-days: 14
